name: checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.cc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: build with warnings as errors
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"
      - name: end-to-end tests
        run: make check
      - name: tests under ASan, UBSan and LSan
        run: make clean && make CC=${{ matrix.cc }} check-sanitize

  threads:
    name: tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: build with TSan
        run: |
          mkdir -p build/tsan
          gcc -D_GNU_SOURCE -O1 -g -std=c11 -fsanitize=thread -pthread -o build/tsan/diskmoon src/*.c
      - name: tests under TSan
        run: TSAN_OPTIONS=halt_on_error=1 DISKMOON=build/tsan/diskmoon python3 tests/run.py

  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: release tarball builds and installs
        run: |
          make dist
          tar -xzf build/diskmoon-*.tar.gz -C build
          make -C build/diskmoon-* check
          make -C build/diskmoon-* DESTDIR=$PWD/build/root PREFIX=/usr install
          test -x build/root/usr/bin/diskmoon
